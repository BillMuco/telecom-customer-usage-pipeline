name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  POSTGRES_USER: telecom_ci
  POSTGRES_PASSWORD: ci_postgres_password
  POSTGRES_DB: telecom_analytics_ci
  AIRFLOW_DB_USER: airflow_ci
  AIRFLOW_DB_PASSWORD: ci_airflow_db_password
  AIRFLOW_DB_NAME: airflow_ci
  AIRFLOW_ADMIN_USERNAME: admin_ci
  AIRFLOW_ADMIN_PASSWORD: ci_airflow_admin_password
  AIRFLOW_ADMIN_EMAIL: airflow-ci@example.com

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Scan tracked files for credentials
        run: python scripts/scan_credentials.py

      - name: Compile Python sources
        run: python -m compileall -q dags scripts spark_jobs tests

      - name: Run fresh-clone tests
        run: python -m pytest -q

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build and initialize Airflow services
        run: >-
          docker compose up -d --build
          postgres spark-master airflow-init airflow-scheduler

      - name: Wait for Airflow scheduler
        shell: bash
        run: |
          for attempt in {1..60}; do
            if docker compose exec -T airflow-scheduler \
              python -m airflow jobs check --job-type SchedulerJob --local; then
              exit 0
            fi
            sleep 5
          done
          echo "Airflow scheduler did not become ready" >&2
          exit 1

      - name: Validate Airflow DAG imports
        run: >-
          docker compose exec -T airflow-scheduler python -c
          "from airflow.models import DagBag;
          bag = DagBag('/opt/airflow/dags', include_examples=False);
          assert not bag.import_errors, bag.import_errors;
          assert 'telecom_customer_usage_pipeline' in bag.dag_ids"

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop CI services
        if: always()
        run: docker compose down --volumes
