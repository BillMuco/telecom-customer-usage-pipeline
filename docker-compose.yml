services:
  postgres:
    image: postgres:16-alpine
    container_name: telecom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-telecom_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telecom_password}
      POSTGRES_DB: ${POSTGRES_DB:-telecom_analytics}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-telecom_user} -d ${POSTGRES_DB:-telecom_analytics}"]
      interval: 10s
      timeout: 5s
      retries: 5

  spark-master:
    image: spark:3.5.8
    container_name: telecom-spark-master
    restart: unless-stopped
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "${SPARK_MASTER_WEBUI_PORT:-8081}:8080"
      - "${SPARK_MASTER_PORT:-7077}:7077"
    volumes:
      - ./data:/opt/telecom-pipeline/data
      - ./spark_jobs:/opt/telecom-pipeline/spark_jobs
      - ./reports:/opt/telecom-pipeline/reports

  spark-worker:
    image: spark:3.5.8
    container_name: telecom-spark-worker
    restart: unless-stopped
    depends_on:
      - spark-master
    command:
      [
        "/opt/spark/bin/spark-class",
        "org.apache.spark.deploy.worker.Worker",
        "spark://spark-master:7077",
        "-m",
        "${SPARK_WORKER_MEMORY:-2G}",
        "-c",
        "${SPARK_WORKER_CORES:-2}"
      ]
    ports:
      - "${SPARK_WORKER_WEBUI_PORT:-8082}:8081"
    volumes:
      - ./data:/opt/telecom-pipeline/data
      - ./spark_jobs:/opt/telecom-pipeline/spark_jobs
      - ./reports:/opt/telecom-pipeline/reports

  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: telecom-airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    environment: &airflow-env
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow_local_password@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW_CONN_SPARK_LOCAL: '{"conn_type":"spark","host":"spark://spark-master","port":7077}'
      PATH: /home/airflow/.local/bin:/usr/local/bin:/usr/bin:/bin
    volumes:
      - ./dags:/opt/airflow/dags
      - ./spark_jobs:/opt/telecom-pipeline/spark_jobs:ro
    entrypoint: [""]
    command: bash -c "python -m airflow db migrate && (python -m airflow users create --username admin --password admin --firstname Local --lastname Admin --role Admin --email admin@example.com || true)"

  airflow-webserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: telecom-airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_started
    environment: *airflow-env
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./spark_jobs:/opt/telecom-pipeline/spark_jobs:ro
      - ./data:/opt/telecom-pipeline/data
      - ./reports:/opt/telecom-pipeline/reports
    entrypoint: [""]
    command: python -m airflow webserver

  airflow-scheduler:
    user: "185:0"
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: telecom-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_started
    environment: *airflow-env
    volumes:
      - ./dags:/opt/airflow/dags
      - ./spark_jobs:/opt/telecom-pipeline/spark_jobs:ro
      - ./data:/opt/telecom-pipeline/data
      - ./reports:/opt/telecom-pipeline/reports
    entrypoint: [""]
    command: python -m airflow scheduler

volumes:
  postgres_data:
